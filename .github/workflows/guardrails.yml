name: Guardrails

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]

jobs:
  guardrail-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EventSourcing.sln

      - name: Run complete test suite
        run: dotnet test tests/EventSourcingBankAccountWeb.Tests/EventSourcingBankAccountWeb.Tests.csproj --configuration Release --no-restore
